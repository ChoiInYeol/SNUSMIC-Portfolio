[project]
name = "verdict-archive-pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "yfinance>=0.2.40",
    "pykrx>=1.0.51",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "optuna>=4.0",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "playwright>=1.40",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
]
# PDF→markdown + OCR: kordoc (Node), pinned in tools/kordoc — see scripts/transcribe_pdfs.py

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
