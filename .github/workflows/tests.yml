name: tests

# Independent accounting oracles precede the non-updatable golden regression gate.
on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --frozen

      - name: Independent financial and publication tests
        env:
          CI: "true"
          UPDATE_GOLDEN: "0"
        run: uv run pytest --junitxml=test-results.xml

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Schema quarantine and API contract tests
        run: node --test tests/report-model.test.cjs tests/api-schemas.test.cjs

      # Build from the committed artifacts, never from a fresh export: a missing or
      # stale public/api file must fail here, not pass CI and break the Vercel build.
      - name: Committed API artifacts match the committed source
        run: uv run python scripts/export_signals_api.py --check

      - run: npm run lint

      - run: npm run build
