name: full-sweep-manual

# 수동 전용 전수 스윕 — 평소엔 일간 증분(refresh-daily)이 전부 커버하므로 스케줄 없음.
# 수집기 버그 복구나 과거 누락 의심 시에만 Actions 탭에서 수동 실행(--full로 전 페이지 순회).
on:
  workflow_dispatch:

permissions:
  contents: write

# Shared concurrency group prevents overlap with the daily incremental workflow.
concurrency:
  group: verdict-archive-refresh
  cancel-in-progress: false

jobs:
  refresh-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --frozen

      # Install Playwright browsers (needed for KUVIC and Voera collectors).
      - name: Install Playwright + browsers
        run: uv run python -m playwright install chromium --with-deps

      # Price lake (git-ignored): silver clean prices, bronze raw fetches, derived price-frame cache.
      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: |
            data/silver/prices
            data/bronze/prices
            data/gold/_cache/price_frames
          key: lake-prices-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            lake-prices-${{ runner.os }}-

      # One-time migration (2026-10 medallion relayout, docs/DATA-LAYERS.md): seed silver from the
      # pre-relayout data/prices cache so the first run stays incremental, and snapshot it into bronze.
      - name: Restore legacy price cache (pre-medallion)
        if: hashFiles('data/silver/prices/*.csv') == ''
        uses: actions/cache/restore@v4
        with:
          path: data/prices
          key: prices-${{ runner.os }}-legacy
          restore-keys: |
            prices-${{ runner.os }}-

      - name: Migrate legacy price cache into the lake
        run: |
          if [ -d data/prices ] && [ ! -d data/silver/prices ]; then
            mkdir -p data/silver data/gold/_cache
            if [ -d data/prices/.cache ]; then mv data/prices/.cache data/gold/_cache/price_frames; fi
            mv data/prices data/silver/prices
          fi
          if [ -d data/silver/prices ] && [ ! -d data/bronze/prices/legacy_import ]; then
            uv run python scripts/rebuild_silver_prices.py --bootstrap-from-silver
          fi

      # Full sweep with per-source status; ANY failure blocks publication (existing artifacts are retained).
      - name: Collect all reports (full sweep)
        run: |
          set +e
          mkdir -p data/bronze/_runs/source-status data/bronze/_runs/quarantine
          failed=0
          for spec in "reports:uv run python scripts/collect_reports.py --source all --full" "kuvic:uv run python scripts/collect_kuvic_browser.py" "smic:uv run python scripts/collect_smic.py --full" "ewha:uv run python scripts/collect_ewha.py --full" "voera:uv run python scripts/collect_voera.py --full"; do
            name="${spec%%:*}"; cmd="${spec#*:}"
            bash -lc "$cmd"; rc=$?
            if [ "$rc" -eq 0 ]; then success=true; error_json=null; else success=false; error_json="\"collector exit $rc\""; failed=1; fi
            printf '{"source":"%s","attempted":true,"exit_code":%s,"collector_success":%s,"error":%s}\n' "$name" "$rc" "$success" "$error_json" > "data/bronze/_runs/source-status/$name.json"
          done
          tar -czf "data/bronze/_runs/quarantine/source-status-${GITHUB_RUN_ID}.tar.gz" data/bronze/_runs/source-status
          [ "$failed" -eq 0 ] || exit 1
      - name: Upload failed-source quarantine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-quarantine-${{ github.run_id }}
          path: data/bronze/_runs/quarantine
          if-no-files-found: ignore

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/kordoc/package-lock.json

      # kordoc: PDF→markdown + built-in Korean OCR, pinned (onnxruntime postinstall allowed in package.json).
      - run: npm ci --prefix tools/kordoc --no-audit --no-fund

      # Transcription is incremental: files with the current kordoc header are skipped.
      - name: Transcribe only-new PDFs
        run: |
          uv run python scripts/transcribe_pdfs.py

      - name: Rebuild dataset, charts, backtest
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          uv run python scripts/build_report_performance.py --sleep 0.3
          uv run python scripts/build_research_review.py
          uv run python scripts/build_search_index.py
          uv run python scripts/build_report_first_seen.py
          uv run python scripts/export_stock_charts.py
          uv run python scripts/backtest_momentum.py
          uv run python scripts/build_strategy_robustness.py
          uv run python scripts/export_signals_api.py
          uv run python scripts/export_api_v2.py

      - name: Pipeline health gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/pipeline_health.py

      # Lineage catalog last: it records every committed artifact above, including health.json.
      - name: Build metadata and data catalog
        run: |
          uv run python scripts/schema_metadata.py
          uv run python scripts/build_catalog.py

      # GITHUB_TOKEN pushes do not trigger tests.yml, so the bot commit must pass
      # the same gate here before it reaches main (and the Vercel build).
      - run: npm ci

      - name: Verify publication (contracts, tests, production build)
        env:
          CI: "true"
          UPDATE_GOLDEN: "0"
        run: |
          uv run python scripts/export_signals_api.py --check
          uv run python scripts/export_api_v2.py --check
          uv run python scripts/build_report_first_seen.py --check
          uv run python scripts/build_research_review.py --check
          uv run python scripts/build_search_index.py --check
          uv run python scripts/paper_portfolio.py --check
          uv run python scripts/build_strategy_robustness.py --check
          uv run python scripts/schema_metadata.py --check
          uv run python scripts/build_catalog.py --check
          uv run pytest
          node --test tests/*.test.cjs
          npm run build

      - name: Durable Bronze backup (when configured)
        if: vars.BRONZE_BACKUP_S3_URI != ''
        env:
          BRONZE_BACKUP_S3_URI: ${{ vars.BRONZE_BACKUP_S3_URI }}
          BRONZE_AWS_ENDPOINT_URL: ${{ vars.BRONZE_AWS_ENDPOINT_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.BRONZE_AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.BRONZE_AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ vars.BRONZE_AWS_REGION || 'ap-northeast-2' }}
        run: |
          uv run python scripts/bronze_backup.py create --store artifacts/bronze-backup
          endpoint=()
          if [ -n "$BRONZE_AWS_ENDPOINT_URL" ]; then endpoint=(--endpoint-url "$BRONZE_AWS_ENDPOINT_URL"); fi
          # Publish manifests only after every referenced object has reached durable storage.
          aws s3 sync artifacts/bronze-backup/objects/ "${BRONZE_BACKUP_S3_URI%/}/objects/" --only-show-errors --no-follow-symlinks "${endpoint[@]}"
          aws s3 sync artifacts/bronze-backup/snapshots/ "${BRONZE_BACKUP_S3_URI%/}/snapshots/" --only-show-errors --no-follow-symlinks "${endpoint[@]}"

      - name: Commit refreshed artifacts
        run: |
          git config user.name "verdict-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/report-performance.json src/data/strategy-backtest.json src/data/report-first-seen.json \
            public/api public/metadata 'public/strategy-trades*.csv' \
            data/gold/reports data/silver/reports/parsed.csv data/silver/reports/parse_issues.csv \
            data/bronze/reports/manifest.json data/bronze/reports/kuvic_items.json data/silver/reports/markdown \
            data/gold/ops/health.json data/silver/reference data/bronze/reference data/catalog.json \
            data/bronze/portfolio data/silver/portfolio public/research
          # The catalog describes the working tree; prove the commit holds exactly that tree for every
          # committed dataset: catalog fresh + no unstaged or untracked file left under any catalog path.
          uv run python scripts/build_catalog.py --check
          mapfile -t specs < <(uv run python scripts/build_catalog.py --tracked-pathspecs | tr -d '\r')
          leftover=$(git status --porcelain --untracked-files=all -- "${specs[@]}" | grep -E '^(.[^ ]|\?\?)' || true)
          if [ -n "$leftover" ]; then echo "catalogued files not staged:"; echo "$leftover"; exit 1; fi
          # data/bronze/reports/pdfs, data/*/prices는 gitignore — add하면 커밋 스텝이 죽는다 (refresh-daily와 동일)
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: weekly full sweep ($(date -u +%F))"
          git push
