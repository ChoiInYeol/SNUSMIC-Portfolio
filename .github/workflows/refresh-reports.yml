name: full-sweep-manual

# 수동 전용 전수 스윕 — 평소엔 일간 증분(refresh-daily)이 전부 커버하므로 스케줄 없음.
# 수집기 버그 복구나 과거 누락 의심 시에만 Actions 탭에서 수동 실행(--full로 전 페이지 순회).
# OCR fallback (ocr_fallback.py) is Windows-only and is skipped in CI.
on:
  workflow_dispatch:

permissions:
  contents: write

# Shared concurrency group prevents overlap with the daily incremental workflow.
concurrency:
  group: verdict-archive-refresh
  cancel-in-progress: false

jobs:
  refresh-weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv python install 3.12

      - run: uv sync --frozen

      # Install Playwright browsers (needed for KUVIC and Voera collectors).
      - name: Install Playwright + browsers
        run: uv run python -m playwright install chromium --with-deps

      # JDK is available on ubuntu-latest via PATH (openjdk pre-installed).
      # transcribe_pdfs.py uses pdfminer/pdfplumber (pure Python); JDK is only
      # needed by opendataloader-pdf tools which this project does not use directly.

      - name: Restore price cache
        uses: actions/cache@v4
        with:
          path: data/prices
          key: prices-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            prices-${{ runner.os }}-

      # Full sweep with per-source status; ANY failure blocks publication (existing artifacts are retained).
      - name: Collect all reports (full sweep)
        run: |
          set +e
          mkdir -p data/source-status data/quarantine
          failed=0
          for spec in "reports:uv run python scripts/collect_reports.py --source all --full" "kuvic:uv run python scripts/collect_kuvic_browser.py" "smic:uv run python scripts/collect_smic.py --full" "ewha:uv run python scripts/collect_ewha.py --full" "voera:uv run python scripts/collect_voera.py --full"; do
            name="${spec%%:*}"; cmd="${spec#*:}"
            bash -lc "$cmd"; rc=$?
            if [ "$rc" -eq 0 ]; then success=true; error_json=null; else success=false; error_json="\"collector exit $rc\""; failed=1; fi
            printf '{"source":"%s","attempted":true,"exit_code":%s,"collector_success":%s,"error":%s}\n' "$name" "$rc" "$success" "$error_json" > "data/source-status/$name.json"
          done
          tar -czf "data/quarantine/source-status-${GITHUB_RUN_ID}.tar.gz" data/source-status
          [ "$failed" -eq 0 ] || exit 1
      - name: Upload failed-source quarantine
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: source-quarantine-${{ github.run_id }}
          path: data/quarantine
          if-no-files-found: ignore

      # Transcription is incremental: already-transcribed .md files are skipped.
      # ocr_fallback.py (Windows winocr) is intentionally skipped in CI.
      - name: Transcribe only-new PDFs
        run: |
          uv run python scripts/transcribe_pdfs.py

      - name: Rebuild dataset, charts, backtest
        env:
          KRX_ID: ${{ secrets.KRX_ID }}
          KRX_PW: ${{ secrets.KRX_PW }}
        run: |
          uv run python scripts/build_report_performance.py --sleep 0.3
          uv run python scripts/export_stock_charts.py
          uv run python scripts/backtest_momentum.py
          uv run python scripts/export_signals_api.py

      - name: Pipeline health gate
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: uv run python scripts/pipeline_health.py

      # GITHUB_TOKEN pushes do not trigger tests.yml, so the bot commit must pass
      # the same gate here before it reaches main (and the Vercel build).
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      - name: Verify publication (contracts, tests, production build)
        env:
          CI: "true"
          UPDATE_GOLDEN: "0"
        run: |
          uv run python scripts/export_signals_api.py --check
          uv run pytest
          node --test tests/report-model.test.cjs tests/api-schemas.test.cjs
          npm run build

      - name: Commit refreshed artifacts
        run: |
          git config user.name "verdict-archive-bot"
          git config user.email "actions@users.noreply.github.com"
          git add src/data/report-performance.json src/data/strategy-backtest.json public/prices \
            public/api public/strategy-marks \
            data/report_performance.csv data/report_parsed.csv data/report_parse_issues.csv \
            data/sources/manifest.json data/markdown
          # data/pdfs는 gitignore — add하면 커밋 스텝이 죽는다 (refresh-daily와 동일)
          git diff --cached --quiet && echo "no changes" && exit 0
          git commit -m "chore: weekly full sweep ($(date -u +%F))"
          git push
